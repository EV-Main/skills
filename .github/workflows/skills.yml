concurrency:
  cancel-in-progress: false
  group: skills-${{ github.ref }}
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - name: Build skargo
        run: |
          out=$(nix build --no-link --print-out-paths .)
          echo "skargo=$out/bin/skargo" >> "$GITHUB_ENV"
      - if: github.event_name != 'push'
        name: Check
        run: $skargo check
      - if: hashFiles('.claude-plugin/marketplace.json') != ''
        name: Validate Claude marketplace
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .
      - if: github.event_name == 'push'
        name: Publish
        run: $skargo publish
name: Skills
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: write
