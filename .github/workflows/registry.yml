# Moves every registry pin to the newest release its `skargo.toml` requirement allows, and commits the lock and marketplace that follow.
name: Registry
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # `check` diffs against released tags
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true # the flake's cachix substituter
      - run: nix run . -- update
      - name: Regenerate the marketplace
        run: nix run . -- check || echo "rewritten; the next step is the verdict" # a moved pin leaves the marketplace stale, which fails this run
      - name: Check
        run: |
          git add skargo.lock .claude-plugin/marketplace.json
          nix run . -- check
      - name: Commit
        run: |
          git diff --cached --quiet && exit 0
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -m "registry: skargo update"
          git push origin HEAD:main
