[package]
name = "skargo"
version = "0.1.0"
edition = "2024"
description = "Cargo-semantics version requirements, lockfile and install for agent skills"
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-Main/skills"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[lints.cargo]
non_kebab_case_bins = "allow"

[lints.rust]
unused_features = "allow"
